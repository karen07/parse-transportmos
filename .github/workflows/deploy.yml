name: Deploy website
on:
  release:
    types:
      - published
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  prepare:
    name: Prepare website
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-24.04
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Validate website
        run: |
          test -s site/routes.html
          test -s site/routes.js
          test -s site/routes.css
          test -s site/routes-config.json
          test -s site/routes-data-worker.js
          test -s site/routes-maplibre-worker.js
          test -s site/boot-loader.js
          test -s site/i18n.js
          test -s site/i18n/index.json
          test -s site/i18n/en.json
          test -s site/i18n/ru.json
          test -s site/styles/light.json
          test -s site/styles/dark.json
          test -s site/moscow-major-roads.svg
          python3 - <<'PY'
          import gzip
          import json
          from pathlib import Path
          site = Path("site")
          config = json.loads((site / "routes-config.json").read_text())
          for name in (config["data_file"], config.get("geometry_file")):
              if name:
                  assert Path(name).name == name
                  with gzip.open(site / name, "rb") as stream:
                      assert stream.read(8) == b"TMAPDATA"
                      while stream.read(1024 * 1024):
                          pass
          PY
      - name: Prepare website
        run: cp site/routes.html site/index.html
      - name: Set artifact name
        id: artifact
        run: echo "name=github-pages-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Upload website
        id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/
          name: ${{ steps.artifact.outputs.name }}
          retention-days: 7
  deploy:
    name: Deploy to GitHub Pages
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for artifact metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.prepare.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ needs.prepare.outputs.artifact_name }}
        run: |
          test -n "$ARTIFACT_ID"
          test -n "$ARTIFACT_NAME"
          for attempt in $(seq 1 24); do
            result=$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              -f name="$ARTIFACT_NAME" \
              --jq '.artifacts[] | select(.expired == false) | .id' || true)
            if [ "$result" = "$ARTIFACT_ID" ]; then
              echo "Artifact $ARTIFACT_NAME ($ARTIFACT_ID) is visible"
              exit 0
            fi
            echo "Waiting for artifact metadata ($attempt/24)"
            sleep 5
          done
          echo "::error::Uploaded artifact did not become visible via the REST API"
          exit 1
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.prepare.outputs.artifact_name }}
